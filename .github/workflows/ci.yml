name: CI

on:
  push:
    branches-ignore:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install format tools
        run: |
          ci/install-format-tools.sh "$RUNNER_TEMP/canon-tools"
          echo "$RUNNER_TEMP/canon-tools/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: ci/check-format.sh

  test:
    name: ${{ matrix.compiler.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: GCC 14
            cc: gcc-14
            cxx: g++-14
            packages: gcc-14 g++-14
            gcov: gcov-14
            llvm_cov: ""
            multi_config: "1"
          - name: Clang 19
            cc: clang-19
            cxx: clang++-19
            packages: clang-19 llvm-19
            gcov: ""
            llvm_cov: llvm-cov-19
            multi_config: ""

    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
      CANON_CI_GCOV_EXECUTABLE: ${{ matrix.compiler.gcov }}
      CANON_CI_LLVM_COV_EXECUTABLE: ${{ matrix.compiler.llvm_cov }}
      CANON_CI_RUN_MULTI_CONFIG: ${{ matrix.compiler.multi_config }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Populate GoogleTest submodule
        run: git submodule update --init external/googletest

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes ${{ matrix.compiler.packages }}

      - name: Install test tools
        run: |
          ci/install-test-tools.sh "$RUNNER_TEMP/canon-tools"
          echo "$RUNNER_TEMP/canon-tools/bin" >> "$GITHUB_PATH"

      - name: Run integration tests
        run: ci/check-tests.sh
